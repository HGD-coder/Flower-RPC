# Flower-RPC 服务端配置
# 配置优先级：JVM -D 参数 > 当前配置文件 > 框架默认值

# ZooKeeper 连接地址
flower.rpc.zk.address=127.0.0.1:2181

# 发布到注册中心、供客户端连接的地址
# 不能填写 0.0.0.0 或 ::
flower.rpc.server.host=127.0.0.1

# Netty 在当前机器上真正监听的地址
# 0.0.0.0 表示监听全部 IPv4 网卡
flower.rpc.server.bind-host=0.0.0.0

# RPC 服务端监听端口
flower.rpc.server.port=9998

# SPI 实现选择
flower.rpc.registry=zk
flower.rpc.discovery=zk
flower.rpc.transport=netty

# 客户端负载均衡策略
flower.rpc.load-balance=consistent-hash

# 序列化和压缩方式
flower.rpc.serializer=kryo
flower.rpc.compress=none

# 连接和请求超时时间，单位为毫秒
flower.rpc.connect-timeout-millis=3000
flower.rpc.request-timeout-millis=5000

# 心跳发送间隔和读空闲超时，单位为秒
flower.rpc.heartbeat.interval-seconds=5
flower.rpc.heartbeat.timeout-seconds=15